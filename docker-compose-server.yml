x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.server
  image: random42-aic:latest
  env_file: .env
  user: "${HOST_UID}:${HOST_GID}"
  volumes:
    # Source is mounted, not only baked into the image, so a code change needs
    # `docker compose restart <service>` instead of a rebuild. Read-only.
    - ./src:/app/src:ro
    - ${DATASET_HOST_PATH}:/app/data:ro
    - ${MODEL_CACHE_HOST_PATH}:/app/model-cache
    - ${LOG_HOST_PATH}:/app/logs
    # QdrantSearchClient memoises a walk of the keyframe tree here; without a
    # host mount that cache dies with the container (~90s to rebuild over 9p).
    - ./.cache/qdrant_prep:/home/appuser/.cache/random42_aic/qdrant_prep
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# NOTE: `hub` is NOT in this file -- it runs locally via docker-compose-local.yml and reaches
# the services below over the network using their `*_HOST_PUBLIC` URLs from .env.
services:
  result_manager:
    <<: *app
    environment:
      SERVICE: result_manager
    ports: ["9022:9022"]

  submission:
    <<: *app
    environment:
      SERVICE: submission
    ports: ["9024:9024"]

  util:
    <<: *app
    environment:
      SERVICE: util
    ports: ["9025:9025"]
    depends_on:
      qdrant-siglip-alpha:
        condition: service_healthy

  rerank:
    <<: *app
    environment:
      SERVICE: rerank
    ports: ["9126:9126"]

  siglip_alpha:
    <<: *app
    environment:
      SERVICE: siglip_alpha
    ports: ["9029:9029"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-siglip-alpha:
        condition: service_healthy

  siglip_beta:
    <<: *app
    environment:
      SERVICE: siglip_beta
    ports: ["9030:9030"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-siglip-beta:
        condition: service_healthy

  metaclip:
    <<: *app
    environment:
      SERVICE: metaclip
    ports: ["9031:9031"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-metaclip:
        condition: service_healthy

  # Matches the engine this index was created and served by. Do NOT downgrade
  # the image: storage format is written by the engine version, and an older
  # engine may refuse or corrupt it. Exactly one engine may hold this directory.
  qdrant-siglip-alpha:
    image: qdrant/qdrant:v1.15.5-gpu-nvidia
    environment:
      QDRANT__GPU__INDEXING: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    volumes: ["${QDRANT_STORAGE_HOST_PATH}:/qdrant/storage"]
    ports: ["6333:6333", "6334:6334"]
    restart: unless-stopped
    healthcheck:
      # The official image has no curl; bash's TCP support hits /readyz.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant-siglip-beta:
    image: qdrant/qdrant:v1.14.1
    volumes: ["./data/qdrant_storage/siglip_beta:/qdrant/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant-metaclip:
    image: qdrant/qdrant:v1.14.1
    volumes: ["./data/qdrant_storage/metaclip:/qdrant/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  media_server:
    image: nginx:alpine
    ports: ["9027:80"]
    volumes:
      - ${DATASET_HOST_PATH}:/data:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
