x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.server
  image: random42-aic:latest
  env_file: .env
  user: "${HOST_UID}:${HOST_GID}"
  volumes:
    - ${DATASET_HOST_PATH}:/app/data:ro
    - ${MODEL_CACHE_HOST_PATH}:/app/model-cache
    - ${LOG_HOST_PATH}:/app/logs
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# NOTE: `hub` is NOT in this file -- it runs locally via docker-compose-local.yml and reaches
# the services below over the network using their `*_HOST_PUBLIC` URLs from .env.
services:
  result_manager:
    <<: *app
    environment:
      SERVICE: result_manager
    ports: ["9022:9022"]

  submission:
    <<: *app
    environment:
      SERVICE: submission
    ports: ["9024:9024"]

  util:
    <<: *app
    environment:
      SERVICE: util
    ports: ["9025:9025"]
    depends_on:
      qdrant-siglip-alpha:
        condition: service_healthy

  rerank:
    <<: *app
    environment:
      SERVICE: rerank
    ports: ["9126:9126"]

  siglip_alpha:
    <<: *app
    environment:
      SERVICE: siglip_alpha
    ports: ["9029:9029"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-siglip-alpha:
        condition: service_healthy

  siglip_beta:
    <<: *app
    environment:
      SERVICE: siglip_beta
    ports: ["9030:9030"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-siglip-beta:
        condition: service_healthy

  metaclip:
    <<: *app
    environment:
      SERVICE: metaclip
    ports: ["9031:9031"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      qdrant-metaclip:
        condition: service_healthy

  qdrant-siglip-alpha:
    # v1.14.3 is not published on Docker Hub; keep the server on the closest
    # available v1.14 release for compatibility with qdrant-client==1.14.3.
    image: qdrant/qdrant:v1.14.1
    volumes: ["./data/qdrant_storage/siglip_alpha:/qdrant/storage"]
    restart: unless-stopped
    healthcheck:
      # The official Qdrant image does not include curl. Bash's TCP socket
      # support lets us check the documented readiness endpoint without
      # adding packages to the database image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant-siglip-beta:
    image: qdrant/qdrant:v1.14.1
    volumes: ["./data/qdrant_storage/siglip_beta:/qdrant/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant-metaclip:
    image: qdrant/qdrant:v1.14.1
    volumes: ["./data/qdrant_storage/metaclip:/qdrant/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  media_server:
    image: nginx:alpine
    ports: ["9027:80"]
    volumes:
      - ${DATASET_HOST_PATH}:/data:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
