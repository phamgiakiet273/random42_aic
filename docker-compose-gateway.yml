# Remote-access gateway + its ngrok tunnel. Kept separate from
# docker-compose-server.yml so the server stack stays untouched; it just joins
# the same network. Started by `./stack.sh start --remote`.
#
#   public URL: https://${NGROK_DOMAIN}   (team ngrok account; NGROK_* in .env)
services:
  gateway:
    image: nginx:alpine
    ports: ["${GATEWAY_PORT:-9090}:80"]
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # the built UI (./stack.sh ui-build), served at / for remote teammates
      - ./src/ui/aic/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Three agents serve the same URL as an ngrok ENDPOINT POOL (--pooling-enabled on
  # all), each through a DIFFERENT edge: sessions drop now and then (Vietnam's links
  # abroad are degraded; two agents on the same Tokyo route dropped 16 s apart), and
  # while one reconnects ngrok routes to the others. The UI retries a stuck read.
  ngrok:   # nearest edge (Singapore)
    image: ngrok/ngrok:latest
    depends_on: [gateway]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env}
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN must be set in .env}", "gateway:80", "--pooling-enabled",
              "--log", "stdout"]
    restart: unless-stopped

  ngrok-2:   # Tokyo
    image: ngrok/ngrok:latest
    depends_on: [gateway]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env}
    volumes:
      - ./ngrok:/etc/ngrok:ro   # the folder: a single-file bind mount goes stale when the file is replaced
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN must be set in .env}", "gateway:80", "--pooling-enabled",
              "--config", "/etc/ngrok/jp.yml",
              "--log", "stdout"]
    restart: unless-stopped

  ngrok-3:   # Mumbai
    image: ngrok/ngrok:latest
    depends_on: [gateway]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env}
    volumes:
      - ./ngrok:/etc/ngrok:ro   # the folder: a single-file bind mount goes stale when the file is replaced
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN must be set in .env}", "gateway:80", "--pooling-enabled",
              "--config", "/etc/ngrok/in.yml",
              "--log", "stdout"]
    restart: unless-stopped

networks:
  default:
    name: aic2026_default
    external: true
