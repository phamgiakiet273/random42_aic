# Remote-access gateway. Kept separate from docker-compose-server.yml so the
# server stack stays untouched; it just joins the same network.
#
#   docker compose -f docker-compose-gateway.yml up -d
#   ngrok http --url=<your-reserved-domain> 9090
services:
  gateway:
    image: nginx:alpine
    ports: ["${GATEWAY_PORT:-9090}:80"]
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  default:
    name: aic2026_default
    external: true
