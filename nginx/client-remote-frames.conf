# Client mode, NO local keyframes: identical to client.conf except that
# /media/frames is proxied to the server through the same tunnel as the video.
# NGINX_IMAGE_HOST/NGINX_VIDEO_HOST are relative, so the app needs to know
# none of this -- it resolves against whatever host the browser used.
server {
    listen 80;
    server_name _;

    # --- SPA ---
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }

    # --- API ---
    location /submission/ {
        proxy_pass http://hub:9021/submission/;
    }

    location /hub/ {
        proxy_pass http://hub:9021/hub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /result_manager/ {
        proxy_pass ${RESULT_MANAGER_UPSTREAM}/result_manager/;
        proxy_set_header Host $proxy_host;   # ngrok routes by Host/SNI
        proxy_ssl_server_name on;            # send SNI when upstream is https
        proxy_read_timeout 300s;
    }

    # --- Frames: NOT on this machine, proxied to the server ---
    # Every thumbnail crosses the tunnel, so the grid is much slower than the
    # local-keyframes setup. Cache hard so a given frame is fetched once.
    location /media/frames/ {
        proxy_pass ${FRAMES_UPSTREAM}/media/frames/;
        proxy_set_header Host $proxy_host;   # ngrok routes by Host/SNI
        proxy_ssl_server_name on;            # send SNI when upstream is https
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;   # upstream sends its own; replace, do not stack
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Video: not local, streamed from the server through the tunnel ---
    location /media/clips/ {
        proxy_pass ${VIDEO_UPSTREAM}/media/clips/;
        proxy_set_header Host $proxy_host;   # ngrok routes by Host/SNI
        proxy_ssl_server_name on;            # send SNI when upstream is https
        proxy_buffering off;              # stream rather than buffer whole files
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_request_headers on;
    }
}
