server {
    listen 80;
    server_name _;

    # The application builds URLs as /img/<dataset-relative-keyframe-path>.
    # `alias` strips the /img/ prefix and serves directly from the mounted
    # processed dataset (for example /img/0/frames/... -> /data/0/frames/...).
    location /img/ {
        alias /data/;
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        autoindex off;
    }

    # The application builds source-video URLs as /video/<batch>/videos/... .
    location /video/ {
        alias /data/original/;
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        autoindex off;
    }
}
