server {
    listen 80;
    server_name _;

    # The application builds URLs as /media/frames/<dataset-relative-keyframe-path>.
    # `alias` strips the prefix and serves directly from the mounted
    # processed dataset (for example /media/frames/0/frames/... -> /data/0/frames/...).
    location /media/frames/ {
        alias /data/;
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        autoindex off;
    }

    # Source-video URLs are /media/clips/<batch>/videos/... .
    location /media/clips/ {
        alias /data/original/;
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        autoindex off;
    }
}
