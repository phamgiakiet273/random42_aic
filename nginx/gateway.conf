# Remote-access gateway: ONE origin fronting every service a client machine
# needs, so a single tunnel (one ngrok domain) is enough.
#
# This works because each service already mounts its routes under a distinct
# prefix -- /hub/, /submission/, /siglip_alpha/, /util/, /result_manager/,
# /media/ -- and the SPA owns everything else, so nothing
# collides and no path rewriting is needed. The client sets every *_HOST_PUBLIC
# / *_UPSTREAM to the same https://<domain>, and the hub's own
# f"{host_public}/util/translate" style URLs land on the right service.
server {
    listen 80;
    server_name _;

    # Big uploads: image search posts a file.
    client_max_body_size 64m;

    # The UI build is served off a Windows-drive bind mount. sendfile() through
    # Docker Desktop's file sharing intermittently sends 0 bytes / truncated
    # bodies -- seen through ngrok as HTTP/2 protocol errors and 503s on the
    # 335 KB JS, i.e. a blank page for teammates.
    sendfile off;
    # Slow competition-day internet: the JS/CSS went out uncompressed (436 KB
    # first load; ~120 KB gzipped). Hub JSON is already gzipped upstream.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # --- HARD BLOCK ---------------------------------------------------------
    # setup_database re-ingests and would destroy PUMPKING_SIGLIP_V2 (RESTORE.md:
    # "Never call GET /{variant}/setup_database"). This gateway is reachable from
    # the public internet through ngrok, so the route is refused here outright.
    location ~ ^/[^/]+/setup_database { return 403 "refused: setup_database is blocked on the gateway\n"; }
    # internal batch-embedding endpoint (offline region job): GPU work, not public
    location ~ ^/[^/]+/embed_images { return 403 "refused: internal endpoint\n"; }

    # --- the UI: prebuilt SPA (src/ui/aic/dist), so a teammate's browser can load
    # it from here instead of building it locally. `./stack.sh ui-build` refreshes it.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }

    # --- hub: search / media_config / everything the SPA calls under /hub ---
    location /hub/ {
        proxy_pass http://hub:9021/hub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- DRES submission: the team's ONE central service (one session, one
    # ACTIVE-evaluation view, one duplicate guard).
    location /submission/ {
        proxy_pass http://submission:9024/submission/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- search model ---
    location /siglip_alpha/ {
        proxy_pass http://siglip_alpha:9029/siglip_alpha/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- util: translate, neighbouring frames, video names ---
    location /util/ {
        proxy_pass http://util:9025/util/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- result manager ---
    location /result_manager/ {
        proxy_pass http://result_manager:9022/result_manager/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- media: frames AND clips, straight through to the media nginx ---
    # Frames are only fetched through here by clients that do NOT hold a local
    # copy of the keyframes; clients that do serve them off their own disk.
    location /media/ {
        proxy_pass http://media_server:80/media/;
        proxy_set_header Host $host;
        proxy_buffering off;               # stream video rather than buffer it
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_request_headers on;
    }

    # --- health ---
    location = /gateway/ping { return 200 "gateway ok\n"; add_header Content-Type text/plain; }
}
