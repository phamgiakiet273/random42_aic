# Client/local mode: one origin serves the SPA, /hub, /result_manager,
# /media/frames (your local keyframes) and /media/clips (tunnelled video).
# NGINX_IMAGE_HOST/NGINX_VIDEO_HOST are relative, so the app needs to know
# none of this -- it resolves against whatever host the browser used.
server {
    listen 80;
    server_name _;

    # --- SPA ---
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }

    # --- API ---
    location /hub/ {
        proxy_pass http://hub:9021/hub/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /result_manager/ {
        proxy_pass ${RESULT_MANAGER_UPSTREAM}/result_manager/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # --- Frames: served from this machine's own disk ---
    # DATASET_HOST_PATH is mounted at /data; keep the trailing slash.
    location /media/frames/ {
        alias /data/;
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        autoindex off;
    }

    # --- Video: not local, streamed from the server through the tunnel ---
    location /media/clips/ {
        proxy_pass ${VIDEO_UPSTREAM}/media/clips/;
        proxy_set_header Host $host;
        proxy_buffering off;              # stream rather than buffer whole files
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_request_headers on;
        add_header Accept-Ranges bytes;
    }
}
