server {
    listen 80;
    server_name _;

    # Keyframe thumbnails. frame_path from search results is relative to
    # DATASET_PATH_TEAM with the full-res SPLIT_NAME ("autoshot") baked in;
    # rewrite it to SPLIT_NAME_LOW_RES ("low_res_autoshot") before resolving
    # -- that's where the real low-res files actually live. Mirrors
    # HubGatewayService.build_image_redirect_target, done in nginx instead
    # so image requests never round-trip through hub's 5-worker pool.
    location /img/ {
        # `alias` cannot be combined with a `rewrite` in the same location
        # (nginx will 500 with "alias cannot be used ... where URI was
        # rewritten") -- so this drops the /img/ prefix as part of the
        # rewrite itself and uses `root`, which appends the full
        # (post-rewrite) URI instead of stripping the location prefix.
        rewrite ^/img/(.*)/frames/autoshot/(.*)$ /$1/frames/low_res_autoshot/$2 break;
        root /usr/share/nginx/html;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Videos. video_path is already relative to DATASET_PATH_ORIGIN
    # ("data/original"), so this is a straight alias, no rewrite needed.
    location /video/ {
        alias /usr/share/nginx/html/original/;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
